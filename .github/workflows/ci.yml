name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: windows-2025
            rid: win-x64
          - os: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build PluginSidecar.slnx -c Release
      - run: dotnet run --project tests/PluginSidecar.Tests -c Release --no-build
      - run: dotnet publish src/PluginSidecar -c Release -r ${{ matrix.rid }} -p:PublishAot=true -o artifacts/${{ matrix.rid }}
      - shell: pwsh
        run: |
          $binary = if ($IsWindows) { './artifacts/${{ matrix.rid }}/PluginSidecar.exe' } else { './artifacts/${{ matrix.rid }}/PluginSidecar' }
          & $binary --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
