name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  guest-sdk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang lld
      - run: python3 eng/build_wasm_sample.py
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-guest-sample
          path: artifacts/wasm-sample/*
  build:
    needs: guest-sdk
    env:
      NEXA_PLUGIN_WORKER: src/PluginSidecar/bin/Release/net10.0/PluginSidecar.dll
      NEXA_WASM_SAMPLE: artifacts/wasm-sample/plugin.zip
      NEXA_WASM_CONFORMANCE: artifacts/wasm-sample/conformance.wasm
      NEXA_WASM_CALLBACK: artifacts/wasm-sample/callback.wasm
      NEXA_WASM_CODEC: artifacts/wasm-sample/codec.wasm
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: windows-2025
            rid: win-x64
          - os: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wasm-guest-sample
          path: artifacts/wasm-sample
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python eng/test_host_references.py
      - run: python eng/prepare_host_reference.py
      - run: python eng/generate_abi100.py --verify
      - run: dotnet build PluginSidecar.slnx -c Release
      - run: dotnet run --project tests/PluginSidecar.Tests -c Release --no-build
      - run: dotnet run --project tests/PluginSidecar.Business.Tests -c Release --no-build
      - run: dotnet run --project tests/PluginSidecar.Presentation.Tests -c Release --no-build
      - run: dotnet publish tests/PluginSidecar.Presentation.Tests -c Release -r ${{ matrix.rid }} -p:PublishAot=true -o artifacts/presentation-aot
      - shell: pwsh
        run: |
          $binary = if ($IsWindows) { './artifacts/presentation-aot/PluginSidecar.Presentation.Tests.exe' } else { './artifacts/presentation-aot/PluginSidecar.Presentation.Tests' }
          & $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: dotnet publish tests/PluginSidecar.Business.Tests -c Release -r ${{ matrix.rid }} -p:PublishAot=true -o artifacts/business-aot
      - shell: pwsh
        run: |
          $binary = if ($IsWindows) { './artifacts/business-aot/PluginSidecar.Business.Tests.exe' } else { './artifacts/business-aot/PluginSidecar.Business.Tests' }
          & $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: dotnet publish tests/PluginSidecar.AotSmoke -c Release -r ${{ matrix.rid }} -p:PublishAot=true -p:TrimmerSingleWarn=false -o artifacts/aot-smoke
      - shell: pwsh
        run: |
          $binary = if ($IsWindows) { './artifacts/aot-smoke/PluginSidecar.AotSmoke.exe' } else { './artifacts/aot-smoke/PluginSidecar.AotSmoke' }
          & $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: python eng/package_sdk.py
      - run: dotnet pack src/Nexa.Plugin.Bootstrap.V1 -c Release -o artifacts/packages
      - run: dotnet pack src/Nexa.Plugin.Sdk.Abi100 -c Release -o artifacts/packages
      - run: dotnet pack src/Nexa.Plugin.MarketDelivery -c Release -o artifacts/packages
      - run: dotnet pack src/Nexa.Plugin.Hosting -c Release -o artifacts/packages
      - run: dotnet pack src/PluginSidecar.WasmRuntime -c Release -o artifacts/packages
      - run: dotnet pack src/PluginSidecar.Packages -c Release -o artifacts/packages
      - run: dotnet pack src/PluginSidecar.RuntimeAdapter -c Release -o artifacts/packages
      - run: python eng/verify_packages.py
      - run: python eng/bundle_sdk.py
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-sdk-${{ matrix.rid }}
          path: artifacts/packages/*
      - run: dotnet publish src/PluginSidecar -c Release -r ${{ matrix.rid }} -p:PublishAot=true -o artifacts/${{ matrix.rid }}
      - shell: pwsh
        run: |
          $binary = if ($IsWindows) { './artifacts/${{ matrix.rid }}/PluginSidecar.exe' } else { './artifacts/${{ matrix.rid }}/PluginSidecar' }
          & $binary --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: python eng/package_worker.py --rid ${{ matrix.rid }} --publish-directory artifacts/${{ matrix.rid }}
      - run: python eng/test_worker_image.py artifacts/worker/${{ matrix.rid }}/Nexa.Plugin.Sidecar.nsc
      - shell: pwsh
        run: |
          $env:NEXA_PLUGIN_WORKER = './artifacts/worker/${{ matrix.rid }}/Nexa.Plugin.Sidecar.nsc'
          $test = if ($IsWindows) { './artifacts/aot-smoke/PluginSidecar.AotSmoke.exe' } else { './artifacts/aot-smoke/PluginSidecar.AotSmoke' }
          & $test --process-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-worker-${{ matrix.rid }}
          path: artifacts/worker/${{ matrix.rid }}/*
